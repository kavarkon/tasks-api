spring:
  datasource:
    url: ${DATABASE_URL}
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

jwt:
  secret: ${JWT_SECRET:development-secret-not-for-production-123456789}

cookie:
  secure: false
cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

logging:
  level:
    root: INFO
    api: DEBUG
